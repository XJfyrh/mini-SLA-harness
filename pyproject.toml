[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-sla-harness"
version = "0.0.1"
description = "Offline development scaffold for a future Mini-SLA harness"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = []

[project.scripts]
mini-sla = "mini_sla_harness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src", "scripts", "tests", ".agents/skills"]
